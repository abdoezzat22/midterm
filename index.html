<style>

html{scroll-padding-top:70px}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}

header b{font-size:17px}
button.r{background:#0a1a33;border:1px solid #0a1a33;color:#f0d77a;border-radius:8px;padding:6px 12px;cursor:pointer;font:inherit}
main{max-width:760px;margin:0 auto;padding:16px}
header{flex-wrap:wrap}
.bx{display:flex;gap:8px}
.b{border:1.5px solid;border-radius:10px;padding:4px 12px;font-size:14px;display:flex;gap:8px;align-items:center}
.b b{font-size:18px}
.b.c{background:var(--gb);border-color:var(--gbd);color:var(--gt)}
.b.w{background:var(--rb);border-color:var(--rbd);color:var(--rt)}
.q{background:var(--card);border:1px solid var(--bd);border-left:4px solid #c9a227;border-radius:12px;padding:14px 16px;margin-bottom:16px}
.t{font-size:12px;color:#e3c25b;margin-bottom:4px}
.qt{font-weight:600;margin-bottom:10px}
.o{display:block;width:100%;text-align:left;background:var(--card);color:var(--tx);border:1.5px solid var(--bd);border-radius:10px;padding:10px 12px;margin-bottom:8px;font:inherit;cursor:pointer}
.o:hover:not(:disabled){border-color:var(--mu)}
.o:disabled{cursor:default}
.o.g{background:var(--gb);border-color:var(--gbd);color:var(--gt)}
.o.x{background:var(--rb);border-color:var(--rbd);color:var(--rt)}
.n{font-size:13px;color:var(--mu);margin-top:4px}
</style></head><body>

S.forEach(([tag,qs])=>qs.forEach(([t,o,a,note])=>{
 n++;const d=document.createElement("div");d.className="q";

 d.querySelector(".qt").textContent=t;
 const bs=o.map((x,i)=>{const b=document.createElement("button");b.className="o";b.textContent=L[i]+". "+x;d.appendChild(b);return b});

 bs.forEach((b,i)=>b.onclick=()=>{bs.forEach(x=>x.disabled=true);done++;
  if(i===a){ok++;b.classList.add("g")}else{b.classList.add("x");bs[a].classList.add("g")}
  if(note)nt.hidden=false;upd()});
